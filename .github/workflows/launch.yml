name: Launch pipeline

# ── Trigger ───────────────────────────────────────────────────────────────────
# Weekly schedule + manual dispatch + pushes to main that touch pipeline code.
# The pipeline runs detached on the compute node; this job only starts it.
#
# A push to main starts a run immediately.  How much of the cache survives that
# run depends on *what* was pushed (see the "Classify the run" step):
#
#   scripts/**, workflow/**, requirements.txt, data/institution_map.json
#       → these produce the persistent data (data/raw partitions + manifests,
#         data/processed).  Cached partitions were written by the *old* code, so
#         the run starts from scratch: the whole cache is wiped and every domain
#         is re-downloaded.
#   R/**, shiny/**
#       → render-only.  Normal incremental run; the fetch cache is reused.
#
# Pushes made by the publish workflow (it commits the run's own results back to
# main as github-actions[bot]) are ignored — see the job-level `if`.
on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC
  push:
    branches: [main]
    paths:
      # Persistent-data code → from-scratch run.
      - "scripts/**"
      - "workflow/**"
      - "requirements.txt"
      - "data/institution_map.json"
      # Render-only code → normal incremental run.
      - "R/**"
      - "shiny/**"
      # This file itself, so trigger changes are exercised on landing.
      - ".github/workflows/launch.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run (optional)"
        required: false
        default: "manual trigger"
      force_rerun:
        description: "Force re-run even if a run is already active"
        type: boolean
        default: false
      from_scratch:
        description: "Discard the fetch cache and re-download every domain"
        type: boolean
        default: false

# ── Concurrency ───────────────────────────────────────────────────────────────
# A burst of pushes must not fire several Snakemake processes at the same
# workdir.  Runs queue instead of overlapping; the lock guard below then makes
# the queued one a no-op if the first is still fetching.
concurrency:
  group: launch-pipeline
  cancel-in-progress: false

# ── Permissions ───────────────────────────────────────────────────────────────
permissions:
  contents: read

# ── Secrets required ──────────────────────────────────────────────────────────
# SSH_PRIVATE_KEY  private half of the SSH key pair
# REMOTE_HOST      server hostname or IP
# REMOTE_USER      Linux user on the server
# REMOTE_WORKDIR   absolute path to the repo on the server

jobs:
  launch:
    name: "Fire Snakemake on server"
    runs-on: ubuntu-latest
    timeout-minutes: 5    # this job should complete in seconds

    # Ignore the publish workflow's own commits ("dashboard: weekly update …",
    # pushed as github-actions[bot]): those carry the results of a finished run,
    # so relaunching on them would loop.  A push made with the default
    # GITHUB_TOKEN does not start workflows at all, and those commits touch only
    # output/ and data/processed/ which the paths filter excludes — this check
    # is the third layer, and the one that still holds if publish.yml ever
    # switches to a PAT or deploy key.
    if: >-
      github.event_name != 'push' ||
      (github.actor != 'github-actions[bot]' &&
       github.event.pusher.name != 'github-actions[bot]')

    steps:
      - name: Checkout (for the changed-file diff)
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0    # `before` may be many commits back

      - name: Classify the run
        id: classify
        run: |
          # scratch=yes means: wipe the persistent fetch cache before firing
          # Snakemake, so the run rebuilds data/raw and data/processed from the
          # APIs instead of serving immutable years off disk.
          SCRATCH=no
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              # Force-push, first push on the branch, or a commit that has been
              # garbage-collected: the diff is unknowable, so take the safe
              # route and rebuild.
              echo "Cannot resolve ${BEFORE} – assuming persistent-data code changed."
              SCRATCH=yes
            else
              CHANGED=$(git diff --name-only "${BEFORE}" "${{ github.sha }}")
              echo "Changed files:"
              echo "${CHANGED}" | sed 's/^/  /'
              # Keep this pattern in step with the persistent-data half of the
              # paths filter at the top of this file.
              if echo "${CHANGED}" | grep -qE '^(scripts/|workflow/|requirements\.txt$|data/institution_map\.json$)'; then
                SCRATCH=yes
              fi
            fi
          elif [ "${{ inputs.from_scratch }}" = "true" ]; then
            SCRATCH=yes
          fi
          echo "scratch=${SCRATCH}" >> "$GITHUB_OUTPUT"
          if [ "${SCRATCH}" = "yes" ]; then
            echo "::notice::Persistent-data code affected – running from scratch (full re-fetch)."
          else
            echo "Incremental run – the fetch cache on the server is reused."
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.REMOTE_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host *\n  ServerAliveInterval 60\n  ServerAliveCountMax 10\n' \
            >> ~/.ssh/config

      - name: Guard against overlapping runs
        id: guard
        run: |
          # If a Snakemake lock file exists the previous run is still active.
          # Record that as an output and let every later step skip: a bare
          # `exit 0` here would end this step successfully and then fire
          # Snakemake anyway, which is exactly what the guard exists to stop.
          if [ "${{ inputs.force_rerun }}" = "true" ]; then
            echo "force_rerun requested – ignoring any active run."
            echo "active=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ACTIVE=$(ssh "${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}" \
            "test -f '${{ secrets.REMOTE_WORKDIR }}/.snakemake/lock' && echo yes || echo no")
          echo "active=${ACTIVE}" >> "$GITHUB_OUTPUT"
          if [ "$ACTIVE" = "yes" ]; then
            echo "::warning::A Snakemake run is already active on the server – skipping launch. Re-dispatch with force_rerun once it finishes if this push must run now."
          fi

      - name: Pull latest code on server
        if: steps.guard.outputs.active != 'yes'
        run: |
          # set -e + an explicit clone-vs-pull branch: if WORKDIR exists but is
          # not a git repo, fail loudly here instead of falling through to fire
          # Snakemake on a stale/broken tree (the old `pull || clone && setup`
          # chain could do exactly that).
          #
          # Use fetch + `reset --hard @{u}` instead of `git pull`: each pipeline
          # run regenerates tracked artefacts (data/processed/*.json, output/*),
          # leaving the server tree dirty so a plain `pull` aborts with "local
          # changes would be overwritten".  The server is a pure run environment
          # — canonical artefacts are committed to main by publish.yml — so
          # discarding its locally-regenerated copies and hard-syncing to origin
          # is the intended behaviour.
          ssh "${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}" \
            "set -e && \
             if [ -d '${{ secrets.REMOTE_WORKDIR }}/.git' ]; then \
               git -C '${{ secrets.REMOTE_WORKDIR }}' fetch origin && \
               git -C '${{ secrets.REMOTE_WORKDIR }}' reset --hard @{u}; \
             else \
               git clone https://github.com/${{ github.repository }} '${{ secrets.REMOTE_WORKDIR }}'; \
             fi && \
             cd '${{ secrets.REMOTE_WORKDIR }}' && \
             python3 -m venv .venv && \
             . .venv/bin/activate && \
             grep -v '^r::' requirements.txt | python3 -m pip install -q -r /dev/stdin && \
             mkdir -p logs && \
             Rscript -e '
               pkgs <- readLines(\"requirements.txt\")
               pkgs <- pkgs[startsWith(pkgs, \"r::\")]
               pkgs <- sub(\"^r::\", \"\", pkgs)
               pkgs <- sub(\";$\", \"\", pkgs)
               pkgs <- trimws(pkgs)
               missing <- pkgs[!pkgs %in% installed.packages()[,\"Package\"]]
               if (length(missing)) {
                 cat(\"Installing R packages:\", paste(missing, collapse=\", \"), \"\\n\")
                 install.packages(missing, repos=\"https://cloud.r-project.org\", quiet=TRUE)
               } else {
                 cat(\"All R packages already installed\\n\")
               }
             '"

      - name: Verify the server is on the pushed commit
        if: steps.guard.outputs.active != 'yes' && github.event_name == 'push'
        run: |
          # The point of a push-triggered run is to exercise the pushed code.
          # If origin/main has already moved on (a later push landed while this
          # job was queued behind the concurrency group), say so rather than
          # silently attributing the run to the wrong commit.
          SERVER_SHA=$(ssh "${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}" \
            "git -C '${{ secrets.REMOTE_WORKDIR }}' rev-parse HEAD")
          echo "Server HEAD: ${SERVER_SHA}"
          echo "This push:   ${{ github.sha }}"
          if [ "${SERVER_SHA}" != "${{ github.sha }}" ]; then
            echo "::warning::Server checked out ${SERVER_SHA}, newer than this push (${{ github.sha }}). The run covers the newer code."
          fi

      - name: Clear sentinel and derived artefacts
        if: steps.guard.outputs.active != 'yes'
        run: |
          # The pull step above hard-resets the server tree to origin/main,
          # which *restores* the committed artefacts (output/*.csv,
          # output/*.png).  Snakemake then sees render's outputs already
          # present, prunes the entire fetch -> join -> render chain, and the
          # run finishes in under a minute having downloaded nothing — while
          # still writing the sentinel, so publish.yml ships stale data.
          # Deleting them here makes a real render the only way to satisfy the
          # DAG, so a silent no-op run becomes impossible.
          #
          # data/raw/ and data/processed/ are deliberately NOT touched here:
          # they are the incremental fetch cache, and the fetch scripts decide
          # for themselves what actually needs re-downloading.  The next step
          # is the one case where that cache must go.
          ssh "${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}" \
            "cd '${{ secrets.REMOTE_WORKDIR }}' && \
             rm -f output/.run_complete output/*.csv output/*.png && \
             rm -rf docs"

      - name: Wipe persistent data cache (from-scratch run)
        if: steps.guard.outputs.active != 'yes' && steps.classify.outputs.scratch == 'yes'
        run: |
          # The code that *wrote* the cache just changed, so every cached
          # artefact is suspect:
          #   data/raw/<domain>/partitions/*.json  per-window checkpoints, only
          #                                        ever re-fetched when their
          #                                        year is mutable or the
          #                                        sha256/FILTER_VERSION check
          #                                        fails — a filter change with
          #                                        no FILTER_VERSION bump would
          #                                        otherwise be served from disk
          #                                        for immutable years forever.
          #   data/raw/<domain>/manifest.json      the bookkeeping that decides
          #                                        the above.
          #   data/raw/<domain>/latest.json        per-domain fetch result.
          #   data/processed/                      join output.
          #   data/domains.json                    tracked, so the pull step's
          #                                        `reset --hard` restores the
          #                                        committed copy and prunes
          #                                        write_domains_json from the
          #                                        DAG (that rule has no
          #                                        run_date rerun trigger, so
          #                                        deleting it is the only way
          #                                        to regenerate it).
          #   data/identifiers_namespaces.json     also tracked; fetch_identifiers
          #                                        does re-run daily on its own,
          #                                        so this one is belt and braces.
          # Removing them leaves the APIs as the only way to satisfy the DAG.
          ssh "${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}" \
            "set -e && cd '${{ secrets.REMOTE_WORKDIR }}' && \
             rm -rf data/raw data/processed data/domains.json data/identifiers_namespaces.json && \
             echo 'Persistent data cache wiped – this run re-downloads every domain.'"

      - name: Fire Snakemake (detached)
        if: steps.guard.outputs.active != 'yes'
        run: |
          # nohup + & + redirected I/O ensures the process outlives the SSH session.
          # --resources ebi_conns=4 caps concurrent EBI download jobs to 4.
          # Adjust this value if the server handles more (or fewer) connections.
          RUN_DATE=$(date -u +%Y-%m-%d)
          ssh "${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}" \
            "cd '${{ secrets.REMOTE_WORKDIR }}' && \
             mkdir -p logs && \
             nohup snakemake \
               --profile workflow/profiles/local \
               --snakefile workflow/Snakefile \
               --resources ebi_conns=4 \
               --restart-times 3 \
               > logs/snakemake_${RUN_DATE}.log 2>&1 &
             echo \"Snakemake PID \$! launched — run log: logs/snakemake_${RUN_DATE}.log\""

      - name: Summary
        if: always()
        run: |
          {
            echo "### Launch pipeline"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Mode | ${{ steps.classify.outputs.scratch == 'yes' && 'from scratch (full re-fetch)' || 'incremental (cache reused)' }} |"
            echo "| Launched | ${{ steps.guard.outputs.active == 'yes' && 'no — a run was already active' || 'yes' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
